<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Conway Life</title>
  </head>
  <body>
    <div class="app">
      <h1>CONWAY LIFE SIMULATOR</h1>

      <div class="control-panel">
        <div class="panel-header">CONWAY LIFE COMPUTER MK-I</div>

        <div class="panel-row">
          <label>WIDTH</label>
          <input type="number" />
          <label>HEIGHT</label>
          <input type="number" />
          <label>ALIVE CELLS [%]</label>
          <input type="number" />
        </div>

        <button class="retro-button">RESTART</button>
        <button id="resetButton">RESET</button>
        <button id="speedUpButton">SPEED UP</button>
        <button id="speedDownButton">SPEED DOWN</button>
        <button id="pauseButton">PAUSE</button>
      </div>

      <div class="status">
        <div>Current Speed: <span id="speedValue">100</span> ms</div>
        <div>Generation: <span id="generationValue">0</span></div>
      </div>

      <canvas id="game"></canvas>
    </div>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
